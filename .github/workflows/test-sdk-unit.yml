name: SDK Unit Tests

on:
  pull_request:
    branches:
      - 'release-v5-*'
      - dev-v5
      - v5-automation-tests
    types:
      - opened
      - synchronize
      - reopened

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──
      - name: Checkout code
        uses: actions/checkout@v4

      # ── JDK (AGP 7.4.2 / Gradle 7.5.1 → JDK 11) ──
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # ── Cache ──
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Run unit tests ──
      - name: Run chat-sdk-android unit tests
        run: ./gradlew :chat-sdk-android:testDebugUnitTest --stacktrace

      # ── Upload test reports (always, even on failure) ──
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-unit-test-reports
          path: |
            chat-sdk-android/build/reports/tests/
            chat-sdk-android/build/test-results/
          retention-days: 14
